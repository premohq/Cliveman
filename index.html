/* === CRT MONITOR HOUSING & EFFECTS === */
html,body{background:#000 !important;overflow:hidden;}
body{perspective:1400px;}
/* Wrapper that gets the curve */
#crtScreen{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;background:#000;z-index:1;}
#crtScreen::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(255,255,255,0.04) 0%,rgba(255,255,255,0) 50%),linear-gradient(180deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0) 12%,rgba(255,255,255,0) 88%,rgba(0,0,0,0.4) 100%);pointer-events:none;z-index:9000;mix-blend-mode:screen;}
#crtScreen::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9001;}
/* Inner content gets the barrel/curve transform */
#crtInner{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:center center;filter:url(#crtCurve);}
/* Vignette + glare on top */
/* ═══ CRT GLASS OVERLAY ═══════════════════════════════════════════════════
   A single fixed, click-through layer on top of everything. Gives the screen
   the look of curved CRT glass: corner vignette, soft glare, edge curvature
   darkening, scanlines and a phosphor dot grid. Zero layout impact. */
#crtVignette{
  position:fixed; inset:0; pointer-events:none; z-index:9002;
  /* Promote to its own compositor layer. The overlay is static, so once it is
     painted to a GPU texture it never needs re-rasterizing as the text below
     it changes — the browser just re-composites the cached layer. This is what
     stops the expensive scanline/dot/gradient stack from being redrawn on
     every typed character. No visual change. */
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
  /* curved-glass corner falloff (stronger) + soft upper glare + corner glare */
  background:
    radial-gradient(ellipse 96% 96% at 50% 50%,
      rgba(0,0,0,0) 50%,
      rgba(0,0,0,0.34) 80%,
      rgba(0,0,0,0.78) 100%),
    radial-gradient(ellipse 85% 55% at 50% -4%,
      rgba(255,255,255,0.08) 0%,
      rgba(255,255,255,0) 58%),
    radial-gradient(ellipse 45% 32% at 80% 6%,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0) 66%);
  /* the inset shadow rims the screen like the edge of curved glass */
  box-shadow:
    inset 0 0 90px rgba(0,0,0,0.55),
    inset 0 0 18px rgba(0,0,0,0.45);
}
/* scanlines (more visible) */
#crtVignette::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 3px);
}
/* phosphor dot grid + faint green screen-glow wash */
#crtVignette::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px,
      transparent 1px, transparent 3px),
    radial-gradient(ellipse 72% 72% at 50% 48%,
      rgba(60,255,120,0.06) 0%,
      rgba(0,0,0,0) 72%);
}
/* === BEVAN DEATH EFFECT: red vignette + screen glitch === */
#redVignette{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9003;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 38%,rgba(150,0,0,0.55) 74%,rgba(40,0,0,0.92) 100%);}
#redVignette.show{animation:redVignettePulse 2.8s ease-out forwards;}
#redVignette.linger{opacity:0.62;transition:opacity 4s ease-out;}
#redVignette.fade{opacity:0;}
.death-glitch{animation:deathGlitch 0.5s steps(3,end) 3 !important;}
/* CRT power-on animation */
#crtPowerOn{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;pointer-events:none;}
#crtPowerOn .crtFlash{position:absolute;top:50%;left:0;width:100%;height:2px;background:#fff;box-shadow:0 0 30px 8px #fff,0 0 60px 16px #fff;transform-origin:center;}
#crtPowerOn.warming .crtFlash{animation:crtWarmup 1.4s ease-out forwards;}
@keyframes crtWarmup{0%{transform:scaleY(0.3) scaleX(0.05);opacity:0;}10%{transform:scaleY(0.5) scaleX(1);opacity:1;}25%{transform:scaleY(120) scaleX(1);opacity:0.8;}55%{transform:scaleY(420) scaleX(1);opacity:0.4;}100%{transform:scaleY(420) scaleX(1);opacity:0;}}
#crtPowerOn.warming{animation:crtScreenOn 1.4s ease-out forwards;}
@keyframes crtScreenOn{0%{background:#000;}30%{background:#000;}55%{background:#0a1a0e;}100%{background:transparent;}}

.fp-pad,.fp-acts{display:none;}
.fp-pad-btn,.fp-act-btn{

  touch-action:none;user-select:none;-webkit-user-select:none;

  transition:background 0.08s;
}
.fp-pad-btn:active,.fp-act-btn:active{background:rgba(51,255,102,0.30);}
/* D-pad cross, lower-left of the viewport */
.fp-pad-btn{width:15%;height:24%;font-size:clamp(14px,4.5vw,22px);min-width:34px;}
.fp-pad-btn.fp-up{left:16.5%;bottom:50%;}
.fp-pad-btn.fp-down{left:16.5%;bottom:6%;}
.fp-pad-btn.fp-left{left:2%;bottom:28%;}
.fp-pad-btn.fp-right{left:31%;bottom:28%;}
/* action buttons, right edge of the viewport, stacked */
.fp-act-btn{right:3%;width:17%;height:20%;font-size:clamp(11px,3.2vw,15px);min-width:42px;min-height:30px;letter-spacing:1px;}
.fp-act-btn:nth-child(1){bottom:56%;}
.fp-act-btn:nth-child(2){bottom:31%;}
.fp-act-btn:nth-child(3){bottom:6%;}
/* Keep the 3D viewport fully visible inside #mapArea (which is height-capped).
   Without a height cap the auto-height canvas grows past the map area on tall
   phones and the bottom of the scene gets clipped. Cap by both axes and let
   the aspect ratio preserve the rendered image. */
.fp-canvas{max-height:46vh;object-fit:contain;margin:0 auto;}.fp-title{font-family:"VT323",monospace;color:var(--amber);font-size:18px;text-shadow:0 0 4px var(--amber);letter-spacing:2px;text-align:center;}.fp-status{font-family:"VT323",monospace;color:#aaccaa;font-size:14px;text-align:center;line-height:1.3;text-shadow:none !important;letter-spacing:0.5px;}.fp-mini-label{font-family:"VT323",monospace;color:#ffb000;font-size:14px;text-shadow:none !important;letter-spacing:2px;text-align:center;}

font-family:'VT323',monospace;font-size:62px;font-weight:bold;font-style:italic;
letter-spacing:8px;text-transform:uppercase;text-align:center;
background:linear-gradient(180deg,#ffe066 0%,#cc8800 30%,#ffcc44 50%,#aa6600 70%,#ffdd66 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(2px 3px 0px #442200) drop-shadow(0px 0px 12px rgba(255,180,0,0.5));
line-height:1.1;padding:8px 0;
}
.snatcher-sub{
font-family:'Share Tech Mono',monospace;font-size:13px;
color:#998866;letter-spacing:6px;text-transform:uppercase;text-align:center;

}

/* === DESKTOP NAV BAR === */
#desktopNav{display:none;flex-shrink:0;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:10px 8px;margin-top:6px;border-top:2px solid var(--green-dim);background:rgba(6,43,16,0.45);}

.desk-btn{background:transparent;border:2px solid var(--green);color:var(--green);font-family:'VT323',monospace;font-size:20px;padding:8px 20px;border-radius:6px;text-shadow:0 0 6px var(--green);box-shadow:0 0 8px rgba(51,255,102,0.3);cursor:pointer;letter-spacing:2px;transition:all 0.1s;}
.desk-btn:hover{background:rgba(51,255,102,0.12);box-shadow:0 0 14px rgba(51,255,102,0.6);}
.desk-btn:active{background:rgba(51,255,102,0.25);}

body.pad-connected #deskBtnGroup{display:none !important;}

.pad-hint{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--green-dim);letter-spacing:1px;margin-left:12px;}
/* === TITLE SCREEN BUTTONS === */
.title-btn{display:block;width:100%;max-width:400px;margin:8px auto;background:transparent;border:2px solid var(--amber);color:var(--amber);font-family:'VT323',monospace;font-size:28px;padding:14px 24px;border-radius:6px;text-shadow:0 0 6px var(--amber);box-shadow:0 0 12px rgba(255,176,0,0.35);cursor:pointer;letter-spacing:3px;transition:all 0.15s;}
.title-btn:hover{background:rgba(255,176,0,0.14);box-shadow:0 0 20px rgba(255,176,0,0.7);transform:scale(1.03);}
.title-btn:active{background:rgba(255,176,0,0.3);}
.title-btn.new-btn{border-color:var(--green);color:var(--green);text-shadow:0 0 6px var(--green);box-shadow:0 0 12px rgba(51,255,102,0.35);}
.title-btn.new-btn:hover{background:rgba(51,255,102,0.12);box-shadow:0 0 20px rgba(51,255,102,0.7);}
.title-btn.gear-btn:hover{background:rgba(51,255,102,0.12);border-color:var(--green)!important;color:var(--green-bright)!important;box-shadow:0 0 20px rgba(51,255,102,0.55);transform:scale(1.08) rotate(30deg);transition:all 0.25s;}
.title-btn.gear-btn{transition:all 0.2s;}
/* === CONTROLLER CONNECTED TOAST === */
#padToast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99999;
  background:rgba(2,10,4,0.92);border:2px solid var(--green);border-radius:8px;
  padding:10px 22px;font-family:'VT323',monospace;font-size:20px;color:var(--green);
  text-shadow:0 0 6px var(--green);box-shadow:0 0 18px rgba(51,255,102,0.45);

/* === GAMEPAD BUTTON INDICATORS === */

/* === NAV ROW WRAPPER === */
#navRow{display:none;flex-shrink:0;}

  body.nav-mode:not(.pad-connected) #navRow #desktopNav{order:0;flex:0 0 auto;border-top:none!important;margin-top:0!important;background:transparent!important;padding:4px 0!important;gap:7px!important;justify-content:flex-start!important;}
  body.nav-mode:not(.pad-connected) #navRow #cmdList{order:1;flex:1;border-top:none!important;margin-top:0!important;text-align:right!important;padding-right:12px!important;background:transparent!important;}
  body.nav-mode:not(.pad-connected) #navRow .desk-btn{font-size:17px!important;padding:6px 16px!important;letter-spacing:1px!important;}
  /* Controller mode: chips CENTERED */
  body.nav-mode.pad-connected #navRow{justify-content:center;}
  body.nav-mode.pad-connected #navRow #desktopNav{order:0;flex:0 0 auto;border-top:none!important;margin-top:0!important;background:transparent!important;padding:4px 0!important;justify-content:center!important;}
  body.nav-mode.pad-connected #navRow #cmdList{display:none!important;}

/* ── nav-mode aiming crosshair (desktop): minimal opaque white plus ── */
.fp-crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:20;filter:drop-shadow(0 0 1px rgba(0,0,0,0.85));}
.fp-crosshair::before,.fp-crosshair::after{content:"";position:absolute;background:#ffffff;}
.fp-crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
.fp-crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%);}
@media (pointer:coarse){.fp-crosshair{display:none !important;}}
/* ── nav item-read confirm prompt (held until the player presses Enter) ── */
.nav-read-prompt{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:45;
  font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;color:var(--green-bright);
  background:rgba(6,20,10,0.86);border:1px solid var(--green-dim);border-radius:5px;padding:6px 16px;
  text-shadow:0 0 6px var(--green);animation:navReadBlink 1.05s steps(1) infinite;cursor:pointer;}
.nav-read-prompt::before{content:"\25B6  ";}
@keyframes navReadBlink{0%,55%{opacity:1}56%,100%{opacity:0.35}}
body.rtl-lang #screen .line.sys,body.rtl-lang #screen .line.press-continue{text-align:center;}
body.rtl-lang .fp-title{direction:rtl;}
body.rtl-lang #cmdList .hint{direction:rtl;text-align:right;}
body.rtl-lang #fpStatusBar{direction:rtl;}
body.rtl-lang .choice-btn{direction:rtl;}
body.rtl-lang #settingsModal{direction:rtl;}
body.rtl-lang #settingsModal button{direction:rtl;}

/* ── Mobile performance: disable expensive GPU overlays ── */
@media(max-width:600px){
  .crt::before,.crt::after{display:none !important;}
  #crtScreen::before,#crtScreen::after{display:none !important;}
  /* Reduce animations */
  .blink{animation:none !important;}
  /* Disable text-shadow on most elements (massive paint cost) */
  #screen .line{text-shadow:none !important;}
  .fp-title{text-shadow:0 0 4px var(--amber) !important;}
  .desk-btn{text-shadow:none !important;}
  /* Disable backdrop filters */
  *{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
}

/* ── Pause menu button ── */
.pause-btn{background:transparent;border:1px solid var(--green-dim);color:var(--green);font-family:'VT323',monospace;font-size:22px;padding:2px 10px;cursor:pointer;margin-right:8px;border-radius:3px;transition:all 0.2s;line-height:1;vertical-align:middle;}
.pause-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,0.1);box-shadow:0 0 8px rgba(255,176,0,0.3);}
/* Hide on title screen */
body:not(.game-started) .pause-btn{display:none;}
/* Pause modal */
#pauseModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99997;display:flex;align-items:center;justify-content:center;padding:20px;}
#pauseModal .pause-box{background:#020a04;border:2px solid var(--amber);box-shadow:0 0 30px rgba(255,176,0,0.5),inset 0 0 20px rgba(6,43,16,0.6);padding:28px 32px;max-width:400px;width:100%;font-family:'VT323',monospace;color:var(--green);}
#pauseModal .pause-title{color:var(--amber);font-size:28px;letter-spacing:4px;text-shadow:0 0 8px var(--amber);text-align:center;margin-bottom:18px;border-bottom:1px dashed var(--green-dim);padding-bottom:12px;}
#pauseModal .pause-btn-row{display:flex;flex-direction:column;gap:10px;}

#pauseModal .pm-btn:hover{background:rgba(51,255,102,0.1);border-color:var(--green-bright);color:var(--green-bright);box-shadow:0 0 12px rgba(51,255,102,0.4);}
#pauseModal .pm-btn.danger{border-color:#cc3333;color:#cc3333;text-shadow:0 0 4px #cc3333;}
#pauseModal .pm-btn.danger:hover{background:rgba(204,51,51,0.15);border-color:#ff4444;color:#ff4444;box-shadow:0 0 12px rgba(255,68,68,0.4);}
@media(max-width:600px){
  #pauseModal .pause-box{padding:20px 16px;max-width:320px;}

/* ═══════════════════════════════════════════════════════════════════════════
   LANDSCAPE PHONE FIXES
   Short, wide touch viewports (a phone held sideways) previously fell through
   the cracks: too wide for the width-based mobile rules to fully tame, too
   short for desktop spacing to fit. Result: oversized text and a cramped,
   barely-playable nav mode. These rules target short touch viewports only
   (height <= 500px + coarse pointer) so desktop and portrait are untouched.
   ═══════════════════════════════════════════════════════════════════════════ */
@media (max-height:500px) and (orientation:landscape) and (pointer:coarse){

  /* ── READING MODE (story text): smaller, centered like desktop ── */
  html,body{font-size:13px;}
  .header{font-size:10px;padding-bottom:3px;margin-bottom:4px;}
  .line{margin-bottom:3px;line-height:1.25;}
  #screen{font-size:13px;line-height:1.3;padding-bottom:4px;}
  .terminal{padding:0 24px;max-width:760px;}
  .crt{padding:6px 0;}
  .choice-btn{font-size:13px;padding:6px 14px;min-height:34px;min-width:64px;}
  #choicePanel{gap:6px;padding:5px 6px;margin-top:3px;}
  .press-continue{font-size:13px;}

  /* Title screen scaling */
  .snatcher-title{font-size:24px;letter-spacing:2px;}
  .snatcher-sub{font-size:11px;letter-spacing:3px;}
  #pixelCityBox{max-width:74vw;height:auto;}

  /* ── NAV MODE: big viewport, overlaid controls (no column split) ──
     The viewport fills the available landscape height; the D-pad and action
     buttons float on top of it (styled in the base + mobile rules). The empty
     story area and the old button bar are removed so the game gets the screen. */
  body.nav-mode .header{display:none;}
  body.nav-mode .terminal{padding:2px 8px;justify-content:center;touch-action:none;overscroll-behavior:none;}
  body.nav-mode #mapArea{max-height:none;display:flex;align-items:center;justify-content:center;}
  body.nav-mode .fp-wrap{width:100%;gap:2px;}
  body.nav-mode .fp-stage{width:auto;max-width:100%;}
  body.nav-mode .fp-canvas{max-height:82vh;max-width:96vw;width:auto;height:auto;}
  body.nav-mode #screen{flex:0 0 auto;min-height:0;max-height:0;padding:0;overflow:hidden;}
  body.nav-mode #mobileNav{display:none !important;}
  .fp-title{font-size:12px;letter-spacing:1px;}
  .fp-status{font-size:10px;line-height:1.1;}
}

/* Very short landscape (small phones): trim text a touch more */
@media (max-height:380px) and (orientation:landscape){
  html,body{font-size:12px;}
  .snatcher-title{font-size:20px;}
  #screen{font-size:12px;}
  .fp-title{font-size:11px;}
  .fp-status{font-size:10px;}
}

/* ── Floor transition label ──
   A brief centered banner naming the floor you're arriving on, that fades in
   then out quickly during a stair climb. Sits above the 3D view, click-through. */
#floorFade{
  position:fixed; inset:0; z-index:9100;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
  opacity:0;
}
#floorFade .ff-text{
  font-family:'Share Tech Mono', monospace;
  color:var(--amber);
  font-size:clamp(20px,5vw,40px);
  letter-spacing:4px;
  text-align:center;
  text-shadow:0 0 10px var(--amber), 0 0 26px rgba(255,176,0,0.5);
  padding:10px 26px;
  border-top:1px solid rgba(255,176,0,0.5);
  border-bottom:1px solid rgba(255,176,0,0.5);
  background:rgba(2,10,6,0.32);
  white-space:nowrap;
}
#floorFade.run{ animation:floorFadeAnim 1100ms ease-in-out forwards; }
@keyframes floorFadeAnim{
  0%   { opacity:0; transform:scale(0.96); }
  18%  { opacity:1; transform:scale(1); }
  62%  { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(1.02); }
}

/* ── Character art (CRT line-art SVG figures) ── */
.line.char-art{ text-align:center; white-space:normal; margin:6px 0; }
.char-art .char-svg{
  display:inline-block;
  width:auto; height:clamp(160px,34vh,300px);
  max-width:92%;
  filter:drop-shadow(0 0 6px rgba(51,255,102,0.35));

/* the glitch class already applies the jitter animation; nudge it for SVG */

@media (max-width:767px),(pointer:coarse){
  .char-art .char-svg{ height:clamp(140px,30vh,240px); }
}
.cv-wrap{position:relative;}.cv-canvas{width:auto!important;max-width:96vw!important;max-height:82vh!important;height:auto!important;margin:0 auto;display:block;}.cv-hint{font-family:"VT323",monospace;color:var(--amber);font-size:14px;letter-spacing:1px;text-align:center;text-shadow:0 0 4px var(--amber);margin-top:2px;}

/* ===== viewport rework: fill screen, hide under-viewport text box, in-view text ===== */

body.nav-mode #screen{display:none !important;}
/* ── nav-dialog: a minigame / multi-line conversation is running. Reveal the text
   screen (where minigames & dialogue render) and suspend the 3D viewport + HUD so
   the interaction is actually visible. Restored to full-screen nav afterwards. ── */

/* ============================================================
   16:9 FULL-SCREEN VIEWPORT for nav + drive
   (desktop & landscape mobile fill the screen; controls overlay.
    portrait mobile keeps the band-on-top + bottom-dock layout.)
   ============================================================ */
/* break the viewport out of the 920px reading column */
body.nav-mode .crt, body.cv-driving .crt{ padding:0 !important; }
body.nav-mode .terminal, body.cv-driving .terminal{ max-width:100vw !important; width:100vw !important; padding:0 !important; }
body.nav-mode #mapArea, body.cv-driving #mapArea{
  width:100vw !important; height:100vh !important; max-height:100vh !important;
  display:flex !important; align-items:center !important; justify-content:center !important; overflow:hidden !important;
}
body.nav-mode .fp-wrap, body.cv-driving .cv-wrap, body.cv-driving .fp-wrap{
  position:relative !important; width:100vw !important; height:100vh !important; max-width:100vw !important;
}
/* The compass work (1.9.10) wrapped both game canvases in .fp-stage
   (position:relative, unsized inline-block), which captured the absolute
   inset-0 canvas below and collapsed the desktop viewport to a 0x0 point.
   Same fix mobile got in the v1.8.4 block: make the stage a full-size
   positioning context so the canvas has a box to fill. */
body.nav-mode .fp-stage, body.cv-driving .fp-stage{
  position:absolute !important; inset:0 !important; display:block !important;
  width:100% !important; height:100% !important; max-width:none !important; line-height:0 !important;
}
body.nav-mode .fp-canvas, body.cv-driving .cv-canvas{
  position:absolute !important; inset:0 !important;
  width:100% !important; height:100% !important; max-width:none !important; max-height:none !important;
  object-fit:cover !important;
}
/* title floats over the top of the viewport */
body.nav-mode .fp-title, body.cv-driving .cv-title{ position:absolute !important; top:26px; left:0; right:0; text-align:center; z-index:14; font-size:14px !important; opacity:0.85; }
/* HERE/context bar pins bottom-centre so the top band belongs to compass + title */
body.nav-mode:not(.nav-dialog) .fp-status{ position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:16; pointer-events:none; background:rgba(2,10,5,0.45); padding:2px 10px; border-radius:5px; }
.fp-status:empty{ display:none; }
/* desktop control bar overlays the bottom-centre of the viewport */
body.nav-mode .cv-bottombar, body.cv-driving .cv-bottombar, body.nav-mode #navRow{
  position:fixed !important; left:50% !important; transform:translateX(-50%); bottom:0 !important;
  width:auto !important; max-width:100vw; z-index:40 !important;
  background:rgba(6,20,10,0.80) !important; border:1px solid var(--green-dim) !important; border-bottom:0 !important;
  border-radius:6px 6px 0 0 !important;
}
/* nav bar shows the same CHECK / SAVE / INV trio as the drive bar */
body.nav-mode:not(.pad-connected) #navRow{ flex-direction:row !important; align-items:center !important; gap:12px !important; margin-top:0 !important; padding:6px 14px !important; }
body.nav-mode:not(.pad-connected) #deskBtnGroup{ display:flex !important; align-items:center !important; gap:7px !important; }

@media (max-width:767px),(pointer:coarse){
  /* the floated desktop nav bar is desktop-only; mobile keeps its own dock/legend flow */
  body.nav-mode #navRow{ position:static !important; transform:none !important; left:auto !important; bottom:auto !important; z-index:auto !important; }
  /* LANDSCAPE: viewport fills; on-glass controls float over the corners */
  @media (orientation:landscape){
    body.cv-driving .cv-steer{ position:fixed !important; left:2vw !important; bottom:4vh !important; }
    body.cv-driving .cv-pedals{ position:fixed !important; right:2vw !important; left:auto !important; bottom:4vh !important; }

  }
  /* PORTRAIT: don't fill — band on top, controls along the bottom */
  @media (orientation:portrait){
    body.nav-mode #mapArea, body.cv-driving #mapArea{ height:auto !important; align-items:flex-start !important; }
    body.nav-mode .fp-wrap, body.cv-driving .cv-wrap, body.cv-driving .fp-wrap{ height:auto !important; }

    }
    body.nav-mode .fp-title, body.cv-driving .cv-title{ position:static !important; }
    body.cv-driving .cv-steer{ position:fixed !important; left:3vw !important; bottom:2vh !important; }
    body.cv-driving .cv-pedals{ position:fixed !important; right:3vw !important; left:auto !important; bottom:2vh !important; }
    body.cv-driving .cv-acts-top{ position:fixed !important; left:50% !important; right:auto !important; top:53vh !important; transform:translateX(-50%); }
    body.nav-mode .fp-pad{ position:fixed !important; left:3vw !important; bottom:2vh !important; width:40vmin; height:40vmin; }
    body.nav-mode .fp-acts{ position:fixed !important; right:3vw !important; left:auto !important; bottom:2vh !important; width:22vmin; height:40vmin; }
    body.nav-mode .cv-bottombar, body.cv-driving .cv-bottombar{ position:static !important; transform:none !important; }
  }
}

body.cv-driving::after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:30;
 background:

}

/* ══════════════════════════════════════════════════════════════════════════
   MOBILE ORIENTATION FIX (v1.8.4)
   Authoritative full-screen layout for nav + drive on touch devices. Appended
   last so it wins the cascade over the earlier, conflicting full-screen rules.
   Fixes: (1) landscape 3D viewport collapsing to 0×0 because the mobile-only
   .fp-stage wrapper was an unsized inline-block and the absolute-inset canvas
   had nothing to fill; (2) title/status shoved off-screen; (3) desktop
   keyboard-hint / nav bar cluttering & overflowing the touch UI; (4) 100vh vs
   the real dynamic viewport (controls hidden behind browser chrome / notch);
   (5) object-fit:cover cropping the baked-in HUD.
   ══════════════════════════════════════════════════════════════════════════ */
@media (max-width:767px),(pointer:coarse){
  /* Kill the perspective tilt in game modes: a transformed ancestor makes
     position:fixed children anchor to it instead of the real viewport, which
     throws the on-glass controls off. Full-bleed, no padding. */
  body.nav-mode .terminal, body.cv-driving .terminal{
    transform:none !important; padding:0 !important;
    width:100vw !important; max-width:100vw !important;
  }
  /* the decorative case-terminal header steals vertical space during gameplay */
  body.nav-mode:not(.nav-dialog) .header, body.cv-driving .header{ display:none !important; }
  body.nav-mode:not(.nav-dialog) #mapArea, body.cv-driving #mapArea{
    width:100vw !important; height:100vh !important; height:100dvh !important;
    max-height:100dvh !important; padding:0 !important; margin:0 !important;
    border:0 !important; display:flex !important;
    align-items:center !important; justify-content:center !important;
    overflow:hidden !important;
  }
  body.nav-mode:not(.nav-dialog) .fp-wrap,
  body.cv-driving .fp-wrap, body.cv-driving .cv-wrap{
    position:relative !important; width:100vw !important;
    height:100vh !important; height:100dvh !important;
    max-width:100vw !important; gap:0 !important; padding:0 !important;
  }
  /* The mobile-only wrapper becomes the full-size positioning context so the
     absolute-inset canvas actually has a box to fill. */
  body.nav-mode:not(.nav-dialog) .fp-stage, body.cv-driving .fp-stage{
    position:absolute !important; inset:0 !important; display:block !important;
    width:100% !important; height:100% !important; max-width:none !important;
    line-height:0 !important;
  }
  /* Letterbox the viewport (contain) so the baked-in HUD text is never cropped. */
  body.nav-mode:not(.nav-dialog) .fp-canvas, body.cv-driving .cv-canvas{
    position:absolute !important; inset:0 !important;
    width:100% !important; height:100% !important;
    max-width:none !important; max-height:none !important;
    object-fit:contain !important; margin:0 !important;
  }
  /* Title + status become overlays so they never consume layout height (which
     was pushing them off the top of the screen). */
  body.nav-mode:not(.nav-dialog) .fp-title, body.cv-driving .cv-title{
    position:absolute !important;
    top:calc(env(safe-area-inset-top,0px) + 22px) !important;
    left:0 !important; right:0 !important; text-align:center !important;
    z-index:16 !important; pointer-events:none !important; margin:0 !important;
  }
  body.nav-mode:not(.nav-dialog) .fp-status{
    position:absolute !important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 6px) !important;
    left:50% !important; transform:translateX(-50%) !important;
    max-width:60vw !important; z-index:16 !important; pointer-events:none !important;
    margin:0 !important; background:rgba(2,10,5,0.55);
    padding:2px 10px !important; border-radius:5px;
  }
  /* The desktop keyboard-hint bar and the duplicate #mobileNav dock are
     redundant with the on-glass touch controls — remove them in game modes so
     they can't overflow or overlap. Choices during dialogue are unaffected. */
  body.nav-mode:not(.nav-dialog) #navRow,
  body.nav-mode:not(.nav-dialog) #cmdList,
  body.nav-mode:not(.nav-dialog) #mobileNav,
  body.cv-driving #navRow, body.cv-driving .cv-cmds,
  body.cv-driving .cv-bottombar{ display:none !important; }

  /* on-glass touch controls are viewport-fixed in both game modes */
  body.nav-mode:not(.nav-dialog) .fp-pad,
  body.nav-mode:not(.nav-dialog) .fp-acts,
  body.cv-driving .cv-steer, body.cv-driving .cv-pedals,
  body.cv-driving .cv-acts-top{ position:fixed !important; z-index:42 !important; }

  /* ── LANDSCAPE: game fills the screen, controls hug the bottom corners ── */
  @media (orientation:landscape){
    body.nav-mode:not(.nav-dialog) .fp-pad{
      left:calc(env(safe-area-inset-left,0px) + 2.5vw) !important; right:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 5vh) !important;
      width:min(34vh,150px) !important; height:min(34vh,150px) !important;
    }
    body.nav-mode:not(.nav-dialog) .fp-acts{
      right:calc(env(safe-area-inset-right,0px) + 2.5vw) !important; left:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 5vh) !important;
      width:min(22vh,96px) !important; height:min(42vh,180px) !important;
    }
    body.cv-driving .cv-steer{
      left:calc(env(safe-area-inset-left,0px) + 2.5vw) !important; right:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 4vh) !important;
    }
    body.cv-driving .cv-pedals{
      right:calc(env(safe-area-inset-right,0px) + 2.5vw) !important; left:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 4vh) !important;
    }
    body.cv-driving .cv-acts-top{
      left:calc(env(safe-area-inset-left,0px) + 2.5vw) !important; right:auto !important;
      top:calc(env(safe-area-inset-top,0px) + 2vh) !important; transform:none !important;
    }
  }
  /* ── PORTRAIT: game strip hugs the top, controls dock across the bottom ── */
  @media (orientation:portrait){
    /* pin the letterboxed view to the top so the lower band is free for the
       thumb controls instead of a dead centred gap */
    body.nav-mode:not(.nav-dialog) .fp-canvas, body.cv-driving .cv-canvas{
      object-position:center top !important;
    }
    /* status sits just under the game strip (its height == 56.25vw when the
       16:9 view is width-limited), well above the corner controls */
    body.nav-mode:not(.nav-dialog) .fp-status{
      bottom:auto !important;
      top:calc(env(safe-area-inset-top,0px) + 56.25vw + 6px) !important;
      transform:translateX(-50%) !important; max-width:92vw !important;
    }
    body.nav-mode:not(.nav-dialog) .fp-pad{
      left:calc(env(safe-area-inset-left,0px) + 4vw) !important; right:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 3vh) !important;
      width:42vw !important; height:42vw !important; max-width:210px; max-height:210px;
    }
    body.nav-mode:not(.nav-dialog) .fp-acts{
      right:calc(env(safe-area-inset-right,0px) + 4vw) !important; left:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 3vh) !important;
      width:24vw !important; height:46vw !important; max-width:120px; max-height:230px;
    }
    body.cv-driving .cv-steer{
      left:calc(env(safe-area-inset-left,0px) + 4vw) !important; right:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vh) !important;
    }
    body.cv-driving .cv-pedals{
      right:calc(env(safe-area-inset-right,0px) + 4vw) !important; left:auto !important;
      bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vh) !important;
    }
    body.cv-driving .cv-acts-top{
      left:50% !important; right:auto !important; transform:translateX(-50%) !important;
      top:calc(env(safe-area-inset-top,0px) + 1vh) !important;
    }
  }
}
