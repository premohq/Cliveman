name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Godot and Windows export template
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dir"
          rm godot.zip templates.tpz

      - name: Export
        working-directory: godot
        run: |
          godot --headless --path . --import
          mkdir -p ../build
          godot --headless --path . --export-release "Windows Desktop" ../build/Cliveman.exe
          test -s ../build/Cliveman.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          zip -9 "Cliveman-${TAG}-windows.zip" Cliveman.exe
          gh release upload "$TAG" "Cliveman-${TAG}-windows.zip" --clobber --repo "$GITHUB_REPOSITORY"
